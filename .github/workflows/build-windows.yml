name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build Windows installer and portable app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: MM3D-Inventory-Windows
          path: |
            release/MM3D-Inventory-Setup-*.exe
            release/MM3D-Inventory-Portable-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: MM3D Inventory 1.0.0
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/MM3D-Inventory-Setup-*.exe
            release/MM3D-Inventory-Portable-*.exe
          body: |
            Windows builds of **MM3D Inventory**.

            - **MM3D-Inventory-Setup-1.0.0.exe** — installer (recommended)
            - **MM3D-Inventory-Portable-1.0.0.exe** — run without installing

            Windows SmartScreen may warn because this build is unsigned. Choose **More info** → **Run anyway**.

            Create your owner email/password on first launch. Optional: Settings → Load sample data.
