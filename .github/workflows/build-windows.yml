name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Read app version
        id: ver
        shell: bash
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      - name: Build Windows installer and portable app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win

      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: MM3D-Inventory-Windows
          path: |
            release/MM3D-Inventory-Setup-*.exe
            release/MM3D-Inventory-Portable-*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Confirm update metadata
        shell: bash
        run: |
          ls -la release
          test -f release/latest.yml
          ls -la release/latest.yml release/MM3D-Inventory-Setup-*.exe

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: MM3D Inventory ${{ steps.ver.outputs.version }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/MM3D-Inventory-Setup-*.exe
            release/MM3D-Inventory-Portable-*.exe
            release/latest.yml
          body: |
            Windows builds of **MM3D Inventory**.

            - **MM3D-Inventory-Setup-${{ steps.ver.outputs.version }}.exe** — installer (recommended; auto-updates)
            - **MM3D-Inventory-Portable-${{ steps.ver.outputs.version }}.exe** — run without installing (no auto-update)

            Installed copies check GitHub Releases after launch and download newer builds in the background. Restart when the app says an update is ready (or just quit — it installs on close).

            Windows SmartScreen may warn because this build is unsigned. Choose **More info** → **Run anyway**.

            Create your owner email/password on first launch. Optional: Settings → Load sample data.
